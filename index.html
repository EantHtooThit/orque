<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>gpu bench</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }

        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        /* HUD Top Bar */
        #hud {
            display: flex; justify-content: space-between; padding: 20px;
            color: #00ffea; text-shadow: 0 0 10px #00ffea; font-weight: bold; font-size: 1.2rem;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        /* Main Menu / Results */
        #menu-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 20; color: white;
        }

        h1 {
            font-size: 5rem; margin: 0; letter-spacing: 5px;
            background: linear-gradient(90deg, #ff0055, #00ffea);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
            text-transform: uppercase;
        }

        p { color: #aaa; font-size: 1.2rem; margin-bottom: 40px; }

        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        
        button {
            padding: 12px 24px; font-size: 1rem; cursor: pointer;
            background: transparent; border: 2px solid #00ffea; color: #00ffea;
            font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.15s;
        }
        button:hover { background: #00ffea; color: black; box-shadow: 0 0 20px #00ffea; }
        button.danger { border-color: #ff0055; color: #ff0055; }
        button.danger:hover { background: #ff0055; color: white; box-shadow: 0 0 20px #ff0055; }

        /* Results Table */
        table { border-collapse: collapse; margin-top: 20px; width: 80%; max-width: 900px; font-size: 1.0em; border: 1px solid #333; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        th { background: #111; color: #00ffea; }
        td { background: #0a0a0a; }
        .score-big { font-size: 3rem; color: #ffaa00; font-weight: bold; text-shadow: 0 0 20px #ffaa00; margin: 10px 0; }
        
        .hidden { display: none !important; }

        /* GPU logo row */
        #gpu-row { display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom:8px; }
        #gpu-logo { 
            width: 120px; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        #gpu-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #gpu-model { color: #ccc; }

        /* Small responsive tweaks */
        @media (max-width:900px){
            .btn-grid { grid-template-columns: 1fr; }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud" class="hidden">
            <div>
                <div id="phase-name">INITIALIZING...</div>
                <div id="timer" style="color: #ff0055">60s</div>
            </div>
            <div style="text-align: right;">
                <div id="fps-counter">FPS: 0</div>
                <div id="obj-counter" style="font-size: 0.8rem; color:#aaa">Objects: 0</div>
            </div>
        </div>
    </div>

    <div id="menu-container">
        <div id="start-screen">
            <h1>Orque</h1>
            <p>the ultimate browser gpu benchmark.</p>
            <div class="btn-grid">
                <button class="danger" onclick="runBenchmark('all')">RUN FULL SUITE (6m)</button>
                <button onclick="runBenchmark(1)">TEST 1</button>
                <button onclick="runBenchmark(2)">TEST 2</button>
                <button onclick="runBenchmark(3)">TEST 3</button>
                <button onclick="runBenchmark(4)">TEST 4</button>
                <button onclick="runBenchmark(5)">TEST 5</button>
                <button onclick="runBenchmark(6)">TEST 6</button>
            </div>
            <div style="margin-top: 20px; font-size: 0.8rem; color: #666;">v2.0 Extreme Levels</div>
        </div>

        <div id="results-screen" class="hidden">
            <h1>RESULTS</h1>
            <div id="gpu-row">
                <div id="gpu-logo"></div>
                <div id="gpu-model" style="color: #888; margin-bottom: 10px;">GPU: Detecting...</div>
            </div>
            <div class="score-big" id="total-score">0</div>
            <table>
                <thead>
                    <tr>
                        <th>Test</th>
                        <th>Avg FPS</th>
                        <th>Min FPS</th>
                        <th>1% Low</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
            <button onclick="location.reload()" style="margin-top: 18px;">MAIN MENU</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GlitchPass } from 'three/addons/postprocessing/GlitchPass.js';
        import { AfterimagePass } from 'three/addons/postprocessing/AfterimagePass.js';

        // --- CONFIG ---
        const DURATION_PER_TEST = 60; // Seconds

        // --- STATE ---
        let renderer, scene, camera, composer;
        let clock = new THREE.Clock();
        let currentTest = 0; // 0=none
        let testQueue = [];
        let testTime = 0;
        let isRunning = false;
        
        // Stats
        let frames = 0;
        let timeAccum = 0;
        let fpsHistory = []; // For 1% lows
        let testResults = {}; // Store results per test ID

        // Scene Objects
        let animatables = [];

        window.runBenchmark = (mode) => {
            const startScreen = document.getElementById('start-screen');
            const menu = document.getElementById('menu-container');
            const hud = document.getElementById('hud');

            startScreen.classList.add('hidden');
            menu.classList.add('hidden');
            hud.classList.remove('hidden');

            // Setup Queue
            if (mode === 'all') testQueue = [1,2,3,4,5,6];
            else testQueue = [mode];

            init3D();
            nextTest();
        };

        function init3D() {
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", stencil: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio); // Force high res for load
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Detect GPU
            const gl = renderer.getContext();
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unknown GPU";
            document.getElementById('gpu-model').innerText = gpu;

            // Show brand logo (image-based)
            detectBrand(gpu);

            window.addEventListener('resize', onResize);
        }

        function onResize() {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        }

        function nextTest() {
            if (testQueue.length === 0) {
                finishBenchmark();
                return;
            }

            currentTest = testQueue.shift();
            testTime = 0;
            fpsHistory = [];
            frames = 0;
            timeAccum = 0;
            isRunning = true;

            // Reset Scene
            if (scene) {
                scene.traverse(object => {
                    if (object.geometry) object.geometry.dispose();
                    if (object.material) {
                        if(Array.isArray(object.material)) object.material.forEach(m=>m.dispose());
                        else object.material.dispose();
                    }
                });
            }
            scene = new THREE.Scene();
            animatables = [];

            // Setup Camera
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            // Common Post-Processing Setup
            composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            // Load Test
            if (currentTest === 1) setupTest1();
            if (currentTest === 2) setupTest2();
            if (currentTest === 3) setupTest3();
            if (currentTest === 4) setupTest4();
            if (currentTest === 5) setupTest5();
            if (currentTest === 6) setupTest6();

            // Start Loop
            clock.start();
            renderer.setAnimationLoop(loop);
        }

        // --- TEST 1: VERTEX CHAOS (Geometry & Instancing) ---
        function setupTest1() {
            document.getElementById('phase-name').innerText = "TEST 1: KINETIC SWARM";
            document.getElementById('obj-counter').innerText = "Objects: 80,000 (Instanced)";
            scene.background = new THREE.Color(0x000510);
            scene.fog = new THREE.FogExp2(0x000510, 0.015);

            camera.position.z = 120;

            // Bloom
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.6);
            composer.addPass(bloomPass);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 2);
            light.position.set(0, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x222222));

            // CUSTOM SHADER MATERIAL (Heavy math on GPU)
            const material = new THREE.MeshStandardMaterial({ color: 0x00ffff, roughness: 0.2, metalness: 0.9 });
            material.onBeforeCompile = (shader) => {
                shader.uniforms.time = { value: 0 };
                animatables.push(shader.uniforms);
                shader.vertexShader = `
                    uniform float time;
                    ${shader.vertexShader}
                `.replace(
                    '#include <begin_vertex>',
                    `#include <begin_vertex>
                     float theta = sin(time + position.y * 0.08) * 2.0;
                     float c = cos(theta);
                     float s = sin(theta);
                     mat2 m = mat2(c, -s, s, c);
                     transformed.xz = m * transformed.xz;
                     transformed.y += sin(time * 5.0 + position.x) * 1.4;
                    `
                );
            };

            const geometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const count = 80000; // Intentional heavy
            const mesh = new THREE.InstancedMesh(geometry, material, count);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            
            const dummy = new THREE.Object3D();
            const spread = 260;
            for(let i=0; i<count; i++) {
                dummy.position.set((Math.random()-0.5)*spread, (Math.random()-0.5)*spread, (Math.random()-0.5)*spread);
                dummy.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(mesh);
            animatables.push({ type: 'rotate', mesh: mesh, speed: 0.12 });
        }

        // --- TEST 2: SHADOW REALM (Lights & Polygons) ---
        function setupTest2() {
            document.getElementById('phase-name').innerText = "TEST 2: RAYSTORM";
            document.getElementById('obj-counter').innerText = "Lights: 40 Dynamic | Polygons: High";
            scene.background = new THREE.Color(0x100000);
            
            camera.position.set(0, 60, 140);
            camera.lookAt(0,0,0);

            // Add Afterimage (Ghosting effect - GPU Heavy)
            const afterimagePass = new AfterimagePass();
            afterimagePass.uniforms["damp"].value = 0.82;
            composer.addPass(afterimagePass);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.0, metalness: 0.8 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

            // Heavy Geometry
            const geo = new THREE.TorusKnotGeometry(2, 0.7, 180, 28);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.08 });

            for(let i=0; i<140; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set((Math.random()-0.5)*180, 10 + Math.random()*40, (Math.random()-0.5)*180);
                mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
                animatables.push({ type: 'float', mesh: mesh, offset: i, speed: 2.4 });
            }

            // Many Moving Lights
            for(let i=0; i<40; i++) {
                const light = new THREE.PointLight(0xffaa00, 1.6, 80);
                light.castShadow = true;
                light.shadow.mapSize.width = 1024; light.shadow.mapSize.height = 1024;
                scene.add(light);
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshBasicMaterial({color:0xffaa00}));
                light.add(sphere);
                animatables.push({ type: 'orbit', obj: light, radius: 30 + Math.random()*80, speed: 0.6 + Math.random()*1.2, offset: Math.random()*10 });
            }
        }

        // --- TEST 3: TRANSPARENCY & POST-PROC OVERLOAD ---
        function setupTest3() {
            document.getElementById('phase-name').innerText = "TEST 3: CRYSTAL OVERDRIVE";
            document.getElementById('obj-counter').innerText = "Passes: Bloom + Glitch + Translucency";
            scene.background = new THREE.Color(0x000000);
            
            camera.position.z = 100;

            // HEAVY Post Processing Stack
            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 1, 0.9);
            composer.addPass(bloom);
            const glitch = new GlitchPass(); glitch.goWild = false; composer.addPass(glitch);

            // Environment Map (remote but commonly available)
            const envMap = new THREE.CubeTextureLoader().setPath('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/cube/Park2/')
                .load(['posx.jpg','negx.jpg','posy.jpg','negy.jpg','posz.jpg','negz.jpg']);
            scene.environment = envMap;

            // Glass Material (Expensive refraction)
            const material = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0, transmission: 0.92, thickness: 2.0, envMap: envMap, ior: 1.5 });

            const geo = new THREE.IcosahedronGeometry(2, 0);
            for(let i=0; i<3000; i++) {
                const mesh = new THREE.Mesh(geo, material);
                mesh.position.set((Math.random()-0.5)*160, (Math.random()-0.5)*160, (Math.random()-0.5)*160);
                mesh.rotation.set(Math.random()*3, Math.random()*3, 0);
                scene.add(mesh);
                animatables.push({ type: 'spin', mesh: mesh, speed: Math.random()*3 });
            }
            const light = new THREE.DirectionalLight(0xffffff, 2); light.position.set(0,0,10); scene.add(light);
        }

        // --- TEST 4: PARTICLE STORM (Huge Points + GPU Shaders) ---
        function setupTest4(){
            document.getElementById('phase-name').innerText = "TEST 4: PARTICLE STORM";
            document.getElementById('obj-counter').innerText = "Points: 200,000 (Shader-driven)";
            scene.background = new THREE.Color(0x030010);

            camera.position.z = 220;

            // Bloom and slight afterimage
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.6, 0.5, 0.6));
            const after = new AfterimagePass(); after.uniforms['damp'].value = 0.9; composer.addPass(after);

            const count = 200000; // extremely heavy
            const positions = new Float32Array(count * 3);
            for(let i=0;i<count;i++){
                positions[3*i] = (Math.random()-0.5)*800;
                positions[3*i+1] = (Math.random()-0.5)*800;
                positions[3*i+2] = (Math.random()-0.5)*800;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.ShaderMaterial({
                transparent:true,
                depthWrite:false,
                uniforms: { time: { value: 0 } },
                vertexShader: `uniform float time; attribute vec3 position; varying float vAlpha; void main(){ vec3 p = position; p.x += sin(time*0.2 + position.y*0.01) * 20.0; vAlpha = 0.5 + 0.5*sin(length(position)*0.02 + time*0.5); gl_PointSize = 1.5 + 1.5*abs(sin(time*0.1 + position.x*0.001)); gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);} `,
                fragmentShader: `varying float vAlpha; void main(){ float d = length(gl_PointCoord - vec2(0.5)); if(d>0.5) discard; gl_FragColor = vec4(vec3(0.0,0.9,0.7), vAlpha); }`
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);
            animatables.push({ time: material.uniforms.time });
            animatables.push({ type:'spin', mesh: points, speed:0.2 });
        }

        // --- TEST 5: SHADOW FRENZY (Lots of casts + High-res shadow maps) ---
        function setupTest5(){
            document.getElementById('phase-name').innerText = "TEST 5: SHADOW FRENZY";
            document.getElementById('obj-counter').innerText = "Boxes: 30k | High-res shadows";
            scene.background = new THREE.Color(0x050005);

            camera.position.set(0,80,200);
            camera.lookAt(0,0,0);

            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.3, 0.6);
            composer.addPass(bloom);

            const baseGeo = new THREE.BoxGeometry(1,1,1);
            const mat = new THREE.MeshStandardMaterial({ color:0x66ffcc, roughness:0.25, metalness:0.6 });

            const group = new THREE.Group();
            const total = 30000;
            for(let i=0;i<total;i++){
                const m = new THREE.Mesh(baseGeo, mat);
                m.scale.setScalar(0.8 + Math.random()*1.4);
                m.position.set((Math.random()-0.5)*400, (Math.random()-0.5)*80, (Math.random()-0.5)*400);
                m.castShadow = true; m.receiveShadow = true;
                group.add(m);
                if(i%100===0) animatables.push({ type:'float', mesh:m, offset:i, speed:1.5 });
            }
            scene.add(group);

            // Several directional lights with high-res shadow maps
            for(let i=0;i<6;i++){
                const light = new THREE.DirectionalLight(0xffffff, 1.2);
                light.position.set(Math.cos(i)*50, 80, Math.sin(i)*50);
                light.castShadow = true;
                light.shadow.mapSize.width = 2048; light.shadow.mapSize.height = 2048;
                light.shadow.camera.left = -200; light.shadow.camera.right = 200; light.shadow.camera.top = 200; light.shadow.camera.bottom = -200;
                scene.add(light);
            }
        }

        // --- TEST 6: COMPOSITE OBLITERATION (Everything combined) ---
        function setupTest6(){
            document.getElementById('phase-name').innerText = "TEST 6: COMPOSITE OBLITERATION";
            document.getElementById('obj-counter').innerText = "Mixed: Instancing + Particles + Transmission";
            scene.background = new THREE.Color(0x000000);

            camera.position.z = 160;

            // Heavy post processing
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 3.0, 1.2, 0.9));
            composer.addPass(new GlitchPass());
            composer.addPass(new AfterimagePass());

            // Mix of many instanced spheres + glass shards
            const shardGeo = new THREE.IcosahedronGeometry(1.8, 0);
            const glass = new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0, roughness:0, transmission:0.95, thickness:1.5, ior:1.45 });

            const instCount = 12000;
            const inst = new THREE.InstancedMesh(shardGeo, glass, instCount);
            const dummy = new THREE.Object3D();
            for(let i=0;i<instCount;i++){
                dummy.position.set((Math.random()-0.5)*360, (Math.random()-0.5)*360, (Math.random()-0.5)*360);
                dummy.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
                dummy.scale.setScalar(0.5 + Math.random()*2.5);
                dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
            }
            scene.add(inst);
            animatables.push({ type:'rotate', mesh: inst, speed:0.3 });

            // Add a storm of small particles too
            const pcount = 60000;
            const positions = new Float32Array(pcount*3);
            for(let i=0;i<pcount;i++){ positions[3*i]=(Math.random()-0.5)*800; positions[3*i+1]=(Math.random()-0.5)*800; positions[3*i+2]=(Math.random()-0.5)*800; }
            const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(positions,3));
            const pmat = new THREE.PointsMaterial({ size:1.2, transparent:true, opacity:0.9 });
            const points = new THREE.Points(pg, pmat); scene.add(points); animatables.push({ type:'spin', mesh:points, speed:0.1 });

            const light = new THREE.DirectionalLight(0xffffff, 1.8); light.position.set(20,40,10); scene.add(light);
        }

        function loop() {
            if(!isRunning) return;

            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();
            testTime += delta;

            // Timer Logic
            const timeLeft = Math.max(0, Math.ceil(DURATION_PER_TEST - testTime));
            document.getElementById('timer').innerText = timeLeft + "s";

            if (testTime >= DURATION_PER_TEST) {
                renderer.setAnimationLoop(null);
                finishTestPhase();
                return;
            }

            // --- ANIMATIONS ---
            animatables.forEach(item => {
                if(item.time !== undefined) {
                    // Shader uniform update
                    item.time.value = elapsed;
                } else if (item.type === 'rotate') {
                    if(item.mesh) item.mesh.rotation.y += (item.speed || 0.1) * delta;
                } else if (item.type === 'float') {
                    if(item.mesh) item.mesh.position.y = 10 + Math.sin(elapsed * (item.speed || 1.5) + (item.offset||0)) * 10;
                } else if (item.type === 'orbit') {
                    if(item.obj) { item.obj.position.x = Math.sin(elapsed * (item.speed || 0.5) + (item.offset||0)) * item.radius; item.obj.position.z = Math.cos(elapsed * (item.speed || 0.5) + (item.offset||0)) * item.radius; }
                } else if (item.type === 'spin') {
                    if(item.mesh) { item.mesh.rotation.x += delta * (item.speed || 1); item.mesh.rotation.y += delta * (item.speed || 1); }
                }
            });

            // Camera Movement (mild per-test)
            if (currentTest === 1) {
                camera.rotation.z = Math.sin(elapsed * 0.1) * 0.2;
                camera.position.z = 120 + Math.sin(elapsed * 0.5) * 22;
            } else if (currentTest === 2) {
                camera.position.x = Math.sin(elapsed * 0.2) * 140;
                camera.position.z = Math.cos(elapsed * 0.2) * 140;
                camera.lookAt(0,0,0);
            } else if (currentTest === 3) {
                camera.position.z -= delta * 5; camera.rotation.z += delta * 0.2; if(camera.position.z < -50) camera.position.z = 160;
            } else if (currentTest === 4) {
                camera.position.z = 220 + Math.sin(elapsed*0.1)*30;
            } else if (currentTest === 5) {
                camera.position.y = 80 + Math.sin(elapsed*0.05)*10;
            } else if (currentTest === 6) {
                camera.position.z = 160 + Math.sin(elapsed*0.05)*40;
            }

            // --- RENDER ---
            composer.render();

            // --- FPS METRICS ---
            frames++; timeAccum += delta;
            if(delta > 0) fpsHistory.push(1/delta);

            if(timeAccum >= 0.5) {
                const fps = Math.round(frames / timeAccum);
                document.getElementById('fps-counter').innerText = "FPS: " + fps;
                const fpsEl = document.getElementById('fps-counter');
                if(fps < 20) fpsEl.style.color = '#ff0055';
                else if(fps < 60) fpsEl.style.color = '#ffaa00';
                else fpsEl.style.color = '#00ffea';
                frames = 0; timeAccum = 0;
            }
        }

        function finishTestPhase() {
            // Calculate stats
            if(fpsHistory.length === 0) fpsHistory.push(0.0001);
            fpsHistory.sort((a,b) => a-b);
            const min = Math.round(fpsHistory[0]);
            const p1Low = Math.round(fpsHistory[Math.max(0, Math.floor(fpsHistory.length * 0.01))]);
            const sum = fpsHistory.reduce((a,b) => a+b, 0);
            const avg = Math.round(sum / fpsHistory.length);

            testResults[currentTest] = { avg, min, p1Low };

            // Clear arrays to free some memory
            fpsHistory = [];
            animatables = [];

            nextTest();
        }

        function finishBenchmark() {
            isRunning = false;
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('menu-container').classList.remove('hidden');
            document.getElementById('results-screen').classList.remove('hidden');

            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';
            let totalScore = 0;

            Object.keys(testResults).forEach(key => {
                const r = testResults[key];
                const score = r.avg * 10 + r.p1Low * 5; // Simple weighting
                totalScore += score;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>TEST ${key}</td>
                    <td style="color:${r.avg>50?'#00ffea':'#ffaa00'}">${r.avg}</td>
                    <td>${r.min}</td>
                    <td style="color:#ff0055">${r.p1Low}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-score').innerText = Math.round(totalScore);
        }

    </script>
